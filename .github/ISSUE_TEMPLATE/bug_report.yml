name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 150, Android 16
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How is it hosted?
      options:
        - Docker image
        - Alpine LXC (install script)
        - Other
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional.
