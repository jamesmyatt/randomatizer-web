services:
  randomatizer:
    image: ghcr.io/jamesmyatt/randomatizer-web:latest
    # Or build locally instead of pulling:
    # build: .
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
